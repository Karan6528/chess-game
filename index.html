<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GISMA Chess Challenge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="start-page">

    <!-- LOGO -->

    <img
        src="Gisma-header-logo.png"
        alt="GISMA Logo"
        class="start-logo"
    >


    <!-- CHESS ICON -->

    <div class="chess-icon">
        ♔
    </div>


    <!-- TITLE -->

    <h1>
        GISMA CHESS CHALLENGE
    </h1>

    <p class="start-tagline">
        THINK • PLAY • CONQUER
    </p>


    <!-- PLAYER CARD -->

    <div class="player-card">

        <h2>
            Game Setup
        </h2>


        <!-- WHITE PLAYER -->

        <div class="input-group">

            <label for="whitePlayer">
                ♙ White Player
            </label>

            <input
                type="text"
                id="whitePlayer"
                placeholder="Enter White player's name"
                autocomplete="off"
            >

        </div>


        <!-- BLACK PLAYER -->

        <div class="input-group">

            <label for="blackPlayer">
                ♟ Black Player
            </label>

            <input
                type="text"
                id="blackPlayer"
                placeholder="Enter Black player's name"
                autocomplete="off"
            >

        </div>


        <!-- GAME TIME -->

        <div class="input-group">

            <label for="gameTime">
                ⏱ Game Time
            </label>

            <select id="gameTime">

                <option value="300">
                    5 Minutes
                </option>

                <option value="600" selected>
                    10 Minutes
                </option>

                <option value="900">
                    15 Minutes
                </option>

                <option value="1800">
                    30 Minutes
                </option>

            </select>

        </div>


        <!-- START -->

        <button
            id="startGame"
            class="start-button"
        >
            ♟ START CHESS GAME
        </button>

    </div>


    <p class="copyright">
        GISMA Chess Challenge
    </p>

</div>


<script src="start.js"></script>

</body>

</html>
